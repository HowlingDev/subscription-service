databaseChangeLog:
  - changeSet:
      id: 2-create-shedlock
      author: grigoriy
      comment: Создание таблицы для блокировки shedlock
      preConditions:
        - not:
            - tableExists:
                tableName: shedlock
      changes:
        - createTable:
            tableName: shedlock
            columns:
              - column:
                  name: name
                  type: varchar(64)
                  remarks: Название запланированной задачи
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lock_until
                  type: timestamp
                  remarks: До какого времени блокировка
                  constraints:
                    nullable: false
              - column:
                  name: locked_at
                  remarks: Когда была взята блокировка
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  remarks: Какой инстанс взял блокировку
                  type: varchar(255)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: shedlock